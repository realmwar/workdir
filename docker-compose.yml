services:
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABRICKS_HOST: "${DATABRICKS_HOST:-}"
      DATABRICKS_TOKEN: "${DATABRICKS_TOKEN:-}"
      ROSSMANN_MODEL_URI: "${ROSSMANN_MODEL_URI:-models:/demo.ml.rossmann_sales_champion/3}"
      NYC_MODEL_URI: "${NYC_MODEL_URI:-models:/demo.ml.nyc_demand_champion/2}"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: "${API_BASE_URL:-http://api:8000}"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
